name: Task15 macOS diagnostic

on:
  push:
    branches:
      - implementation/v0.1-vertical-slice

permissions:
  contents: read

concurrency:
  group: task15-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8.15.5
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vectors:check
      - run: pnpm test
      - run: pnpm artifact:pack -- knowledge/artifact-manifest.json ux-skill-macos.tar
      - run: shasum -a 256 ux-skill-macos.tar
