name: Implementation CI

on:
  push:
    branches:
      - implementation/v0.1-vertical-slice

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm vectors:check
      - run: pnpm test
      - run: pnpm baseline:red
