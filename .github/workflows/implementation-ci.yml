name: Implementation CI

on:
  push:
    branches:
      - implementation/v0.1-vertical-slice

permissions:
  contents: read

concurrency:
  group: implementation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 8.15.5
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm vectors:check
      - name: Reject conflicting CI modes
        if: hashFiles('.github/expected-red-patterns.txt') != '' && hashFiles('.github/diagnostic-tests.txt') != ''
        run: echo 'Conflicting expected-red and diagnostic markers.' >&2; exit 1
      - name: Run tests
        if: hashFiles('.github/expected-red-patterns.txt') == '' && hashFiles('.github/diagnostic-tests.txt') == ''
        run: pnpm test
      - name: Verify intentional RED without failing workflow
        if: hashFiles('.github/expected-red-patterns.txt') != '' && hashFiles('.github/diagnostic-tests.txt') == ''
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/expected-red.log" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/expected-red.log"
          if [ "$test_status" -eq 0 ]; then
            echo "Expected RED, but the test suite passed." >&2
            exit 1
          fi
          pattern_count=0
          while IFS= read -r expected_pattern || [ -n "$expected_pattern" ]; do
            case "$expected_pattern" in
              ""|\#*) continue ;;
            esac
            pattern_count=$((pattern_count + 1))
            if ! grep -F -- "$expected_pattern" "$RUNNER_TEMP/expected-red.log" >/dev/null; then
              echo "Expected RED pattern not found: $expected_pattern" >&2
              exit 1
            fi
          done < .github/expected-red-patterns.txt
          if [ "$pattern_count" -eq 0 ]; then
            echo "Expected RED marker contains no assertion patterns." >&2
            exit 1
          fi
          echo "Intentional RED verified; workflow remains green to avoid failure notifications."
      - name: Run diagnostic tests without notification failure
        if: hashFiles('.github/diagnostic-tests.txt') != '' && hashFiles('.github/expected-red-patterns.txt') == ''
        shell: bash
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/diagnostic-tests.log" 2>&1
          diagnostic_status=$?
          set -e
          cat "$RUNNER_TEMP/diagnostic-tests.log"
          echo "diagnostic_test_exit_code=$diagnostic_status"
          echo "## Diagnostic tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: $diagnostic_status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$diagnostic_status" -ne 0 ]; then
            echo "::warning::Diagnostic tests failed with exit code $diagnostic_status; this run is not GREEN evidence."
          fi
          exit 0
      - run: pnpm baseline:red